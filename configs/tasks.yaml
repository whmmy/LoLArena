# LoLArena — task definitions & scoring weights
#
# Two scopes:
#   match = a whole series (Bo3/Bo5). Truth comes from PandaScore match.results[].
#   game  = a single game (after BP). Truth comes from /lol/games/{id}.
#
# Each sub-task names:
#   metric          : which function in graders/metrics computes the score
#   output_field    : key in the prediction JSON
#   weight_in_layer : relative weight within its layer
#   layer_weight    : weight of the parent layer in the composite

# ================= SERIES (match) =================
# Layers are all HARD-VALIDATED against ground truth — no free points for
# filling in text fields. Free-text fields (reasoning / swing_factors /
# meta_style_signals) are kept in the schema + shown in the UI but do NOT
# enter the composite; only verifiable predictions move the score.
match:
  layer_weights:
    T1_result:  0.55      # did the model get the result right?
    T2_skill:   0.30      # did the model's probability BEAT a naive baseline?
    T3_lineup:  0.15      # did it name the players who actually decided it?

  tasks:
    # ------- T1: core result -------
    - id: series_winner_prob
      layer: T1_result
      weight_in_layer: 0.50
      metric: brier_binary
      output_field: win_probs
      notes: Model-owned blue/red probability. The higher side must match predicted series winner.
    - id: series_score
      layer: T1_result
      weight_in_layer: 0.35
      metric: scoreline_similarity
      output_field: series_score
      notes: e.g. predicted "3-1" vs true "3-1".
    - id: series_length_mae
      layer: T1_result
      weight_in_layer: 0.15
      metric: mae
      output_field: series_length
      notes: predicted total games vs true total games.

    # ------- T2: skill vs naive baseline -------
    - id: skill_vs_baseline
      layer: T2_skill
      weight_in_layer: 1.00
      metric: skill_score
      output_field: win_probs
      notes: >
        Does the model's win_prob beat a naive baseline built from each team's
        long-run win rate (team_objectives.game_record.win_rate)? model==baseline
        -> 50; model better -> higher; model worse -> lower. Missing baseline
        (no context_pack data) -> neutral 50. A model that merely parrots
        "favorite wins" earns ~50; real analytical value is what lifts this.

    # ------- T3: lineup recall (now truth-fed, no longer free 100) -------
    - id: key_players
      layer: T3_lineup
      weight_in_layer: 1.00
      metric: key_players_recall
      output_field: key_players
      notes: >
        Fraction of the real starting lineup the model named as key players.
        Truth players now come from context_pack.rosters (was empty before,
        which made every model score 100). A model naming invented/irrelevant
        names no longer gets a free pass.

    # NOTE: reasoning / swing_factors / meta_style_signals are intentionally
    # NOT scored — they have no ground truth to check against, and the old
    # structural/length checks gave every model a flat 100 (55% of the
    # composite), collapsing all discrimination. They remain in the schema
    # and the UI for human reading.

# ================= SINGLE GAME =================
game:
  layer_weights:
    G1_result:   0.50
    G2_duration: 0.25
    G3_kills:    0.25

  tasks:
    - id: game_winner
      layer: G1_result
      weight_in_layer: 1.00
      metric: brier_binary
      output_field: win_prob
      notes: blue/red game winner probability vs actual winner.
    - id: duration_mae
      layer: G2_duration
      weight_in_layer: 1.00
      metric: mae
      output_field: expected_duration_min
      scale: 8            # |error| (min) that scores 0. Default max(2,truth) is too
                          # tight (~2min -> 0) and rewards risk-free convergence to the
                          # league mean. 8 lets a well-reasoned BP-specific call beat a
                          # generic "32 min" while still punishing big misses.
      notes: predicted vs actual game length in minutes.
    - id: kills_blue_mae
      layer: G3_kills
      weight_in_layer: 0.30
      metric: mae
      output_field: kills.blue
      scale: 8            # |error| (kills) that scores 0. Tighter than the default
                          # max(2,truth)≈15 so a 7-kill miss actually costs something.
    - id: kills_red_mae
      layer: G3_kills
      weight_in_layer: 0.30
      metric: mae
      output_field: kills.red
      scale: 8
    - id: total_kills_smape
      layer: G3_kills
      weight_in_layer: 0.40
      metric: smape
      output_field: total_kills
